<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eddie-Man</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#000;--fg:#fff;--ac:#ffd400;--card:#10107a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;text-align:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{margin:12px 0 6px;font-size:16px;line-height:1.4;color:var(--ac);text-shadow:2px 2px #f00}
#hud{display:flex;justify-content:space-between;align-items:center;width:min(94vw,420px);margin:6px auto;font-size:10px}
#wrap{position:relative;width:min(94vw,420px);margin:0 auto}
canvas{display:block;width:100%;height:auto;box-sizing:border-box;background:#000;border:4px solid #2121ff;image-rendering:pixelated;touch-action:none}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
#ov{position:absolute;inset:4px;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;overflow:auto;z-index:2}
#ov h2{margin:6px 0;color:var(--ac);font-size:14px;line-height:1.5}
#ov.intro-screen{inset:4px;background:radial-gradient(ellipse at 50% 35%,rgba(19,34,113,.96),rgba(0,0,0,.98) 72%);border:2px solid #2121ff;box-sizing:border-box}
.intro-kicker{color:#69e6ff;font-size:8px;line-height:1.8;letter-spacing:1px;margin-bottom:10px}
#ov .intro-title{font-size:clamp(21px,7vw,31px);line-height:1.45;color:#ffd400;text-shadow:3px 3px #f22,6px 6px #6714a8;margin:4px 0}
#ov .intro-sub{font-size:clamp(10px,3vw,13px);letter-spacing:2px;color:#55ddff;margin:2px 0 16px}
#ov .intro-copy{font-size:clamp(8px,2.5vw,10px);line-height:2.1;max-width:310px;color:#fff;margin:8px auto 14px}
#ov .intro-footer{font-size:7px;color:#b5b8ff;line-height:1.8;margin-top:14px}
#ov #go.intro-start{border:2px solid #fff04a;outline:2px solid #ff4b4b;outline-offset:3px;background:#ffd400;color:#100b24;font-size:clamp(9px,2.7vw,11px);padding:14px 12px;max-width:100%;animation:buttonPulse 1.4s ease-in-out infinite}
@keyframes buttonPulse{50%{filter:brightness(1.22);transform:scale(1.025)}}
#ov p{margin:6px 0;font-size:9px;line-height:1.7}
button{font-family:inherit;background:var(--ac);color:#000;border:0;border-radius:0;font-size:13px;padding:12px 18px;margin-top:12px;box-shadow:4px 4px 0 #f00}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #f00}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center;margin:12px 0}
#pad button{margin:0;padding:0;font-size:20px;background:var(--card);color:var(--fg);box-shadow:3px 3px 0 #2121ff}
#pad .u{grid-column:2}#pad .l{grid-row:2;grid-column:1}#pad .d{grid-row:2;grid-column:2}#pad .r{grid-row:2;grid-column:3}
</style></head><body>
<h1>EDDIE-MAN</h1>
<div id="hud"><span id="sc">Score 0</span><span id="lv">❤️❤️❤️</span></div>
<button id="musicBtn" type="button" aria-label="Toggle background music">♫ MUSIC: ON</button>
<div id="wrap"><canvas id="cv"></canvas>
<div id="ov"></div></div>
<div id="pad"><button class="u" data-d="0,-1">▲</button><button class="l" data-d="-1,0">◀</button><button class="d" data-d="0,1">▼</button><button class="r" data-d="1,0">▶</button></div>
<script>
const W=15,H=15;
function genMap(l){
 let s=l*7919+13;const rnd=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const m=Array.from({length:H},()=>Array(W).fill('#')),seen={'0,0':1},st=[[0,0]];m[1][1]=' ';
 while(st.length){const[x,y]=st[st.length-1];
  const n=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>{const X=x+a,Y=y+b;return X>=0&&X<4&&Y>=0&&Y<7&&!seen[X+','+Y]});
  if(!n.length){st.pop();continue}
  const[a,b]=n[Math.floor(rnd()*n.length)],X=x+a,Y=y+b;seen[X+','+Y]=1;
  m[1+2*y+b][1+2*x+a]=' ';m[1+2*Y][1+2*X]=' ';st.push([X,Y])}
 for(let r=0;r<H;r++)for(let c=0;c<8;c++)m[r][14-c]=m[r][c];
 for(let k=0;k<12+l;k++){const r=1+Math.floor(rnd()*13),c=1+Math.floor(rnd()*7);if((r+c)%2===1&&m[r][c]==='#'){m[r][c]=' ';m[r][14-c]=' '}}
 for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(m[r][c]===' ')m[r][c]='.';
 [[1,1],[13,1],[1,13],[13,13]].forEach(([c,r])=>m[r][c]='o');m[11][7]=' ';
 return m}
const GS=[3,5,9,11];
const CH=[{n:'Eddie',c:'#ffd400'},{n:'Mom',c:'#ff4d6d'},{n:'Dad',c:'#4dd2ff'},{n:'Tiny Tim',c:'#ffb347'},{n:'Heaven',c:'#ff8cf0'}];
const DIRS=[[0,-1],[-1,0],[0,1],[1,0]];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const imgs={};let grid,dots,P,G,fright,score,lives,state='setup',last=0,killer='',level=1;
let pizzaCollected=false,pizzaToast=0,musicOn=true,musicTimer=null,musicStep=0;
const levelTunes=[
 [523,659,784,659,587,698,880,698,523,659,784,988,880,784,659,587],
 [392,494,587,494,440,523,659,523,392,494,587,784,659,587,494,440],
 [440,554,659,554,494,587,740,587,440,554,659,880,740,659,554,494],
 [587,698,880,698,659,784,988,784,587,698,880,1047,988,880,784,659],
 [330,392,494,392,349,440,523,440,330,392,494,659,523,494,392,349],
 [523,784,659,880,784,659,587,784,523,784,659,988,880,784,659,523],
 [392,587,494,659,587,494,440,587,392,587,494,784,659,587,494,392],
 [440,659,554,740,659,554,494,659,440,659,554,880,740,659,554,440],
 [349,440,523,659,523,440,392,494,587,784,587,494,440,523,659,880],
 [523,659,784,1047,988,784,880,659,587,784,988,1175,1047,880,784,523]
];
cv.width=cv.height=300;
const open=(c,r)=>grid[r]&&grid[r][c]!=='#'&&grid[r][c]!==undefined;
function newLevel(){grid=genMap(level);dots=0;grid.forEach(r=>r.forEach(c=>{if(c==='.'||c==='o')dots++}));placePizza();resetPos()}
function placePizza(){
  if(pizzaCollected||level!==1)return;
  let best=null,bestD=Infinity;
  for(let r=2;r<H-2;r++)for(let c=2;c<W-2;c++){
    if(grid[r][c]!=='.')continue;
    const d=(c-7)**2+(r-7)**2;
    if(d<bestD){bestD=d;best={c,r}}
  }
  if(best)grid[best.r][best.c]='p';
}
function resetPos(){P={c:7,r:11,dx:0,dy:0,t:0,want:[0,0],m:0};G=GS.map((c,i)=>({id:i+1,c,r:7,dx:0,dy:0,t:0,delay:1+i*2,out:false}));fright=0}
let AC,wk=0;function beep(f,d,t,v,f2){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.linearRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function eat(c,r){const v=grid[r][c];if(v==='.'){grid[r][c]=' ';dots--;score+=10;wk=!wk;beep(wk?260:340,.05)}else if(v==='o'){grid[r][c]=' ';dots--;score+=50;beep(200,.4,'square',.06,900);fright=Math.max(2.5,6.5-level*.4)}}
function adv(e,s,arrive){
  if(!e.dx&&!e.dy){arrive(e);if(!e.dx&&!e.dy)return}
  e.t+=s;
  while(e.t>=1){e.c+=e.dx;e.r+=e.dy;e.t-=1;arrive(e,true);if(!e.dx&&!e.dy){e.t=0;break}}
}
function pArrive(e,f){
  if(f)eat(e.c,e.r);
  const[wx,wy]=e.want;
  if((wx||wy)&&open(e.c+wx,e.r+wy)){e.dx=wx;e.dy=wy}
  else if(!open(e.c+e.dx,e.r+e.dy)){e.dx=0;e.dy=0}
}
function gArrive(e){
  let o=DIRS.filter(d=>open(e.c+d[0],e.r+d[1])&&!(d[0]===-e.dx&&d[1]===-e.dy));
  if(!o.length)o=DIRS.filter(d=>open(e.c+d[0],e.r+d[1]));
  let d;
  if(fright>0||Math.random()<(e.id===4?.5:.2))d=o[Math.floor(Math.random()*o.length)];
  else{
    const tx=P.c+P.dx*(e.id%2?3:0),ty=P.r+P.dy*(e.id%2?3:0);
    d=o.reduce((b,x)=>{const dd=(e.c+x[0]-tx)**2+(e.r+x[1]-ty)**2,bb=(e.c+b[0]-tx)**2+(e.r+b[1]-ty)**2;return dd<bb?x:b});
  }
  e.dx=d[0];e.dy=d[1];
}
function setDir(dx,dy){
  if(state==='setup')return;
  if(state==='ready'){state='play'}
  P.want=[dx,dy];
  if(P.dx===-dx&&P.dy===-dy&&(dx||dy)){P.c+=P.dx;P.r+=P.dy;P.t=1-P.t;P.dx=dx;P.dy=dy}
}
const pos=e=>[e.c+e.dx*e.t,e.r+e.dy*e.t];
function update(dt){
  if(state!=='play')return;
  if(fright>0)fright-=dt;
  if(pizzaToast>0)pizzaToast=Math.max(0,pizzaToast-dt);
  adv(P,5.5*dt,pArrive);P.m+=dt*10;
  G.forEach(e=>{
    if(!e.out){e.delay-=dt;if(e.delay<=0)e.out=true;return}
    adv(e,(fright>0?3:4+level*.15)*dt,gArrive);
  });
  const[px,py]=pos(P);
  for(const e of G){
    if(!e.out)continue;
    const[gx,gy]=pos(e);
    if(Math.hypot(px-gx,py-gy)<.6){
      if(fright>0){score+=200;beep(500,.25,'square',.06,1100);Object.assign(e,{c:GS[e.id-1],r:7,dx:0,dy:0,t:0,delay:2,out:false})}
      else{beep(500,.7,'sawtooth',.06,50);lives--;killer=CH[e.id].n;state='dead';showMsg();return}
    }
  }
  if(dots<=0){state=level>=10?'win':'clear';beep(660,.5,'square',.06,1320);showMsg()}
}
function face(i,x,y,r,ring,dim){
  const a=Math.round(r*2),X=Math.round(x-r),Y=Math.round(y-r);
  ctx.fillStyle=ring;ctx.fillRect(X,Y,a,a);
  if(imgs[i])ctx.drawImage(imgs[i],X+2,Y+2,a-4,a-4);else{ctx.fillStyle=CH[i].c;ctx.fillRect(X+2,Y+2,a-4,a-4)}
  if(dim){ctx.fillStyle='rgba(30,60,255,.5)';ctx.fillRect(X+2,Y+2,a-4,a-4)}
}
function draw(){
  const s=cv.width/W;ctx.imageSmoothingEnabled=false;ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.width);
  const bl=Math.floor(performance.now()/250)%2;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const v=grid[r][c],x=c*s,y=r*s;
    if(v==='#'){ctx.fillStyle='#10107a';ctx.fillRect(x,y,s,s);ctx.strokeStyle='#3d6bff';ctx.lineWidth=2;ctx.strokeRect(x+3,y+3,s-6,s-6)}
    else if(v==='.'){ctx.fillStyle='#ffb8ae';ctx.fillRect(x+s/2-1.5,y+s/2-1.5,3,3)}
    else if(v==='o'&&bl){ctx.fillStyle='#fff';ctx.fillRect(x+s/2-4,y+s/2-4,8,8)}
    else if(v==='p'){const cx=x+s/2,cy=y+s/2;ctx.fillStyle='#a94f18';ctx.beginPath();ctx.arc(cx,cy,s*.36,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd447';ctx.beginPath();ctx.arc(cx,cy,s*.29,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e84b36';[[ -.22,-.08],[.12,-.2],[.2,.12],[-.12,.19]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(cx+a*s,cy+b*s,s*.055,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#8bc34a';[[-.08,-.18],[.22,-.02],[-.22,.1],[.04,.22]].forEach(([a,b])=>{ctx.fillRect(cx+a*s,cy+b*s,s*.09,s*.09)})}
  }
  let[px,py]=pos(P);px=(px+.5)*s;py=(py+.5)*s;const R=s*.5;
  const ang=Math.atan2(P.dy||0,P.dx||1),mo=.05+.3*Math.abs(Math.sin(P.m));
  ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,mo*Math.PI,(2-mo)*Math.PI);ctx.closePath();ctx.rotate(-ang);ctx.translate(-px,-py);ctx.clip();
  if(imgs[0])ctx.drawImage(imgs[0],px-R,py-R,R*2,R*2);else{ctx.fillStyle='#ffd400';ctx.fillRect(px-R,py-R,R*2,R*2)}
  ctx.restore();
  ctx.beginPath();ctx.arc(px,py,R,mo*Math.PI,(2-mo)*Math.PI);ctx.lineTo(px,py);ctx.closePath();ctx.lineWidth=2;ctx.strokeStyle='#ffd400';ctx.stroke();
  G.forEach(e=>{
    const[gx,gy]=pos(e),x=(gx+.5)*s,y=(gy+.5)*s,f=fright>0,blink=f&&fright<2&&Math.floor(fright*5)%2;
    face(e.id,x,y,s*.46,f?(blink?'#fff':'#3b5bff'):CH[e.id].c,f);
  });
  if(pizzaToast>0){ctx.fillStyle='rgba(0,0,0,.88)';ctx.fillRect(18,8,264,28);ctx.strokeStyle='#ffd400';ctx.lineWidth=2;ctx.strokeRect(18,8,264,28);ctx.fillStyle='#ffd400';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('HAWAIIAN PIZZA!  +3 LIVES 🍍',150,25)}
}
function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;update(dt);sc.textContent='Lv '+level+'/10  Score '+score;if(grid)draw();requestAnimationFrame(loop)}
function hearts(){document.getElementById('lv').textContent='❤️'.repeat(Math.max(lives,0))}
function showMsg(){
  ov.classList.remove('intro-screen');hearts();ov.style.display='flex';
  if(state==='clear'){ov.innerHTML=`<h2>Level ${level} clear! 🎉</h2><p>+1 life. Ghosts get faster...</p><button id="go">Level ${level+1}</button>`;go.onclick=()=>{level++;lives=Math.min(lives+1,5);hearts();newLevel();ov.style.display='none';state='ready';startMusicForLevel(level)}}
  else if(state==='dead'&&lives>0){ov.innerHTML=`<h2>Caught by ${killer}! 😱</h2><p>${lives} ${lives>1?'lives':'life'} left</p><button id="go">Try again</button>`;
    go.onclick=()=>{ov.style.display='none';resetPos();state='ready';startMusicForLevel(level)}}
  else if(state==='dead'){state='over';ov.innerHTML=`<h2>Game over!</h2><p>${killer} got you. Happy birthday anyway, Eddie! 🎂</p><p>Score: ${score}</p><button id="go">Play again</button>`;go.onclick=start}
  else{ov.innerHTML=`<h2>🎉 HAPPY BIRTHDAY EDDIE! 🎉</h2><p>You beat all 10 levels and ate the whole family’s dots!</p><p>Score: ${score}</p><button id="go">Play again</button>`;go.onclick=start}
}
function start(){ov.classList.remove('intro-screen');score=0;lives=3;level=1;pizzaCollected=false;pizzaToast=0;hearts();newLevel();ov.style.display='none';state='ready';startMusicForLevel(level)}
// Cinematic birthday title screen
function setup(){
  stopMusic(); state='setup'; ov.classList.add('intro-screen'); ov.style.display='flex';
  ov.innerHTML='<div class="intro-kicker">✦ A SPECIAL BIRTHDAY EDITION ✦</div><h2 class="intro-title">EDDIE-MAN</h2><p class="intro-sub">BIRTHDAY QUEST</p><p class="intro-copy">A game made exclusively for Eddie.<br>Collect the dots. Dodge the ghosts.<br>Find the legendary Hawaiian pizza.</p><button id="go" class="intro-start" type="button">▶ START ADVENTURE</button><p class="intro-footer">PLAYER 1: EDDIE · 10 LEVELS · 3 LIVES</p>';
  const startButton=document.getElementById('go'); if(startButton) startButton.addEventListener('click',start,{once:true});
}
document.getElementById('musicBtn').onclick=()=>{musicOn=!musicOn;document.getElementById('musicBtn').textContent='♫ MUSIC: '+(musicOn?'ON':'OFF');if(musicOn&&state!=='setup')startMusicForLevel(level);else stopMusic()};
function paint(cn,i){const x=cn.getContext('2d');x.clearRect(0,0,84,84);if(imgs[i])x.drawImage(imgs[i],0,0,84,84);else{x.fillStyle=CH[i].c;x.fillRect(0,0,84,84);x.fillStyle='#000';x.font='bold 44px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(CH[i].n[0],42,44)}}
function setImg(i,url,cn,save){
  const im=new Image();im.onload=()=>{
    const k=document.createElement('canvas');k.width=k.height=16;const s=Math.min(im.width,im.height);
    k.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,16,16);const kc=k.getContext('2d'),dd=kc.getImageData(0,0,16,16),q=v=>Math.round(v/85)*85;for(let j=0;j<dd.data.length;j+=4){dd.data[j]=q(dd.data[j]);dd.data[j+1]=q(dd.data[j+1]);dd.data[j+2]=q(dd.data[j+2])}kc.putImageData(dd,0,0);imgs[i]=k;
    if(cn)paint(cn,i);
    if(save)try{localStorage.setItem('em2_'+i,k.toDataURL('image/jpeg',.8))}catch(e){}
